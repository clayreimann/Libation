# libationd-web-image.yml
# Fork-only: tests the libationd web UI and publishes its image to ghcr.io.
---
name: libationd-web-image

on:
  push:
    branches: [libationd/main]
  pull_request:
    paths: ['web/**', '.github/workflows/libationd-web-image.yml']
  workflow_dispatch:

jobs:
  test:
    if: github.repository_owner == 'clayreimann'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test

  build_and_push:
    if: github.repository_owner == 'clayreimann' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Short sha
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: web
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/clayreimann/libation-web:latest
            ghcr.io/clayreimann/libation-web:${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
